<meta name="theme-color" content="#0B1220">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --ink:#0B1220;
    --ink-2:#101A2E;
    --ink-3:#182642;
    --paper:#F3F5FA;
    --surface:#FFFFFF;
    --line:#E4E8F1;
    --line-soft:#EEF1F7;
    --text:#111827;
    --text-muted:#6B7688;
    --text-dim:#98A2B8;
    --teal:#0FB6A6;
    --teal-dark:#0A8F82;
    --indigo:#5B62F4;
    --amber:#B9770E;
    --amber-bg:#FEF3DC;
    --red:#C53030;
    --red-bg:#FCE9E9;
    --green:#0E8F5A;
    --green-bg:#E4F7EE;
    --grad: linear-gradient(135deg, var(--teal) 0%, var(--indigo) 100%);
    --shadow-sm: 0 1px 2px rgba(11,18,32,.06);
    --shadow-md: 0 8px 24px rgba(11,18,32,.10);
    --shadow-lg: 0 24px 64px rgba(11,18,32,.28);
    --radius: 14px;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif; letter-spacing:-.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  ::selection{background:var(--teal); color:#fff;}

  /* ---------- Utility ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:10px; padding:12px 18px; font-weight:600; font-size:14.5px;
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease, opacity .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{background:#1c2740;}
  .btn-accent{background:var(--grad); color:#fff; box-shadow:0 6px 18px rgba(91,98,244,.28);}
  .btn-accent:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent; color:var(--text); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--line-soft);}
  .btn-sm{padding:8px 12px; font-size:13px; border-radius:8px;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.55; cursor:not-allowed;}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--text-muted); margin-bottom:6px;}
  .field input, .field select{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line);
    font-size:14.5px; background:#fff; color:var(--text); outline:none;
    transition:border-color .12s ease, box-shadow .12s ease;
  }
  .field input:focus, .field select:focus{border-color:var(--teal); box-shadow:0 0 0 3px rgba(15,182,166,.14);}

<body>
<div id="app"></div>
<div id="toast-root"></div>

<script>
/* ============================================================
   KONEXIA LINK — protótipo de plataforma (dados em memória)
   ============================================================ */

/* ---------- PWA: manifest montado via Blob ----------
   Navegadores (Chrome/Edge) checam o manifest para decidir se o site pode
   ser "instalado". Um manifest como data: URI direto no <link> nem sempre
   é reconhecido de forma confiável — um Blob URL gerado em tempo de
   execução funciona de forma muito mais consistente. Reaproveitamos os
   ícones que já estão embutidos nos <link rel="icon"> para não duplicar
   os dados no arquivo. */
(function setupManifest(){
  try{
    const icon192 = document.querySelector('link[rel="icon"][sizes="192x192"]')?.href;
    const icon512 = document.querySelector('link[rel="icon"][sizes="512x512"]')?.href;
    const here = window.location.href.split('#')[0].split('?')[0];
    const dir = here.substring(0, here.lastIndexOf('/') + 1) || here;

    const manifest = {
      name: "Konexia Link",
      short_name: "Konexia Link",
      description: "Plataforma de clientes Konexia Link — contas, Pix e boleto.",
      start_url: here,
      scope: dir,
      display: "standalone",
      background_color: "#0B1220",
      theme_color: "#0B1220",
      icons: [
        icon192 ? { src: icon192, sizes: "192x192", type: "image/png", purpose: "any" } : null,
        icon512 ? { src: icon512, sizes: "512x512", type: "image/png", purpose: "any" } : null,
      ].filter(Boolean)
    };

    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const url = URL.createObjectURL(blob);
    const link = document.getElementById('pwaManifestLink');
    if(link) link.href = url;
  }catch(e){ /* segue sem manifest dinâmico — favicons continuam funcionando */ }
})();

/* ---------- PWA: service worker mínimo (embutido via Blob) ----------
   Reforça os critérios de "instalável" nos navegadores. Só funciona quando
   o arquivo é servido via https:// ou http://localhost — em file:// direto
   do computador o navegador bloqueia service workers por segurança. */
if('serviceWorker' in navigator && window.isSecureContext){
  try{
    const swCode = `
      self.addEventListener('install', e => self.skipWaiting());
      self.addEventListener('activate', e => self.clients.claim());
      self.addEventListener('fetch', () => {});
    `;
    const swBlob = new Blob([swCode], {type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(swBlob), { scope: './' }).catch(()=>{});
  }catch(e){ /* ambiente não suporta — sem problema, app funciona normalmente */ }
}

/* ---------- PWA: instalar no celular ou PC ---------- */
let deferredInstallPrompt = null;

function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}
function isStandaloneApp(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function refreshInstallButtons(){
  const hide = isStandaloneApp();
  document.querySelectorAll('[data-install-btn]').forEach(btn=>{
    btn.style.display = hide ? 'none' : '';
  });
}
function bindInstallButtons(){
  document.querySelectorAll('[data-install-btn]').forEach(btn=> btn.onclick = handleInstallClick);
  refreshInstallButtons();
}
async function handleInstallClick(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    refreshInstallButtons();
    if(choice && choice.outcome === 'accepted') toast('Instalando o Konexia Link…');
    return;
  }
  if(isIOS()){ showIOSInstallModal(); return; }
  toast('Use o menu do navegador (⋮ ou ⋯) e escolha "Instalar app" ou "Adicionar à tela inicial".');
}
function showIOSInstallModal(){
  const old = document.getElementById('iosInstallOverlay');
  if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'iosInstallOverlay';
  overlay.innerHTML = `
  <div class="modal" style="max-width:380px;">
    <div class="modal-head">
      <div><h3>Instalar no iPhone/iPad</h3><div class="sub">Safari não instala automaticamente — são só 2 toques</div></div>
      <button class="modal-close" id="closeIosModal">${ICONS.x}</button>
    </div>
    <div class="modal-body">
      <div class="ios-step"><span class="ios-num">1</span>Toque no ícone de <b>Compartilhar</b> (o quadrado com uma seta para cima) na barra do Safari.</div>
      <div class="ios-step"><span class="ios-num">2</span>Escolha <b>"Adicionar à Tela de Início"</b> e confirme.</div>
      <div class="hint" style="margin-top:6px;">Pronto — o ícone da Konexia Link aparece na tela inicial como um app normal.</div>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#closeIosModal').onclick = ()=> overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
}
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  refreshInstallButtons();
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  refreshInstallButtons();
  toast('Konexia Link instalado com sucesso!');
});
function installButtonHTML(variant){
  if(variant === 'nav'){
    return `<button class="navitem" data-install-btn>📲 Instalar app</button>`;
  }
  return `<button class="btn btn-ghost btn-block" data-install-btn>📲 Instalar aplicativo (celular ou PC)</button>`;
}

/* ---------- Ícones (SVG inline, minimalistas) ---------- */
const ICONS = {
  link: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/></svg>`,

function konexiaRealLogo(maxWidth){
  maxWidth = maxWidth || 220;
  return `<img src="${KONEXIA_LOGO_SRC}" alt="Konexia Link" style="width:${maxWidth}px; max-width:100%; height:auto; display:block;">`;
}

const konexiaLogoMark = (size=34, dark=false) => `
  <svg width="${size}" height="${size}" viewBox="0 0 40 40" fill="none">
    <defs>
      <linearGradient id="kg${size}${dark}" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
        <stop stop-color="#3FE0CB"/><stop offset="1" stop-color="#6A6FF2"/>
      </linearGradient>
    </defs>
    <rect x="3" y="12" width="20" height="20" rx="7" transform="rotate(-20 3 12)" fill="url(#kg${size}${dark})" opacity="0.92"/>
    <rect x="17" y="8" width="20" height="20" rx="7" transform="rotate(-20 17 8)" fill="${dark ? '#0B1220' : '#FFFFFF'}" stroke="url(#kg${size}${dark})" stroke-width="2.4"/>
  </svg>`;

function logo(dark=false, size=34, showWord=true){
  return `<div class="logo ${dark?'logo-on-dark':'logo-on-light'}">
    ${konexiaLogoMark(size, dark)}
    ${showWord ? `<span class="logo-word">Konexia<span class="light">&nbsp;Link</span></span>` : ''}
  </div>`;
}

function addMonthsToDate(dateStr, months){
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDate();
  d.setMonth(d.getMonth() + months);
  if(d.getDate() !== day) d.setDate(0); // corrige overflow em meses mais curtos (ex: 31 -> fev)
  return d.toISOString().slice(0,10);
}

}

/* ---------- Regras de desconto (antecipação) e juros/multa (atraso) ----------
   Desconto por antecipação: 15% sobre o valor, se pago antes do vencimento.
   Atraso: multa de 2% + juros de mora de 1% ao mês (pro rata die), limites usuais
   para relações de consumo conforme o Código de Defesa do Consumidor (art. 52, §1º).
   Os percentuais de desconto/atraso são parametrizáveis pela empresa; confirme os
   valores praticados com seu setor jurídico/financeiro antes de usar em produção. */
const DESCONTO_ANTECIPADO = 0.15;   // 15%
const MULTA_ATRASO = 0.02;          // 2% (multa fixa)
const JUROS_MORA_MENSAL = 0.01;     // 1% ao mês, pro rata dia

function daysBetween(a, b){
  return Math.round((new Date(a+'T00:00:00') - new Date(b+'T00:00:00')) / 86400000);
}

function calcValorAtual(bill){
  const status = billStatus(bill);
  const referral = bill.referral || null;
  const referralValor = referral ? Math.min(referral.valor, bill.amount) : 0;
  const base = bill.amount - referralValor; // valor após desconto de indicação, antes de antecipação/atraso

  if(status === 'pago'){
    return { tipo:'pago', valor: bill.amount, referral };
  }
  const today = todayISO();
  if(bill.dueDate > today){
    const desconto = base * DESCONTO_ANTECIPADO;
    return { tipo:'antecipado', valor: base - desconto, original: bill.amount, desconto, referral, referralValor };
  }
  if(bill.dueDate === today){
    return { tipo:'no-prazo', valor: base, original: bill.amount, referral, referralValor };
  }
  const diasAtraso = daysBetween(today, bill.dueDate);
  const multa = base * MULTA_ATRASO;
  const juros = base * JUROS_MORA_MENSAL * (diasAtraso/30);
  return { tipo:'atraso', valor: base + multa + juros, original: bill.amount, multa, juros, diasAtraso, referral, referralValor };
}

/* Rede de nós animada no painel de login */
function drawNetwork(){
  const canvas = document.getElementById('netCanvas');
  if(!canvas || window.innerWidth <= 860) return;
  const ctx = canvas.getContext('2d');
  let w,h;
  function resize(){
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = w * devicePixelRatio; canvas.height = h * devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  resize(); window.addEventListener('resize', resize);
  const N = 34;
  const pts = Array.from({length:N}, () => ({
    x: Math.random(), y: Math.random(),
    vx: (Math.random()-0.5)*0.0007, vy:(Math.random()-0.5)*0.0007
  }));
  function tick(){
    if(!document.body.contains(canvas)) return;
    ctx.clearRect(0,0,w,h);
    pts.forEach(p=>{
      p.x += p.vx; p.y += p.vy;
      if(p.x<0||p.x>1) p.vx*=-1;
      if(p.y<0||p.y>1) p.vy*=-1;
    });
    for(let i=0;i<N;i++){
      for(let j=i+1;j<N;j++){
        const a=pts[i], b=pts[j];
        const dx=(a.x-b.x)*w, dy=(a.y-b.y)*h;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < 150){
          ctx.strokeStyle = `rgba(127,235,221,${0.16*(1-dist/150)})`;
          ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(a.x*w,a.y*h); ctx.lineTo(b.x*w,b.y*h); ctx.stroke();
        }
      }
    }
    pts.forEach(p=>{
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.arc(p.x*w, p.y*h, 1.6, 0, Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  tick();
}

function qrSvg(seedStr){
  const size = 21; const cell = 8;
  let seed = 0; for(const c of seedStr) seed = (seed*31 + c.charCodeAt(0)) >>> 0;
  function rnd(){ seed = (seed*1103515245 + 12345) >>> 0; return (seed/4294967295); }
  let cells = '';
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const inFinder = (x<7&&y<7)||(x>size-8&&y<7)||(x<7&&y>size-8);
      if(inFinder) continue;
      if(rnd() > 0.56) cells += `<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="#0B1220"/>`;
    }
  }
  const finder = (fx,fy) => `
    <rect x="${fx}" y="${fy}" width="${7*cell}" height="${7*cell}" fill="#0B1220"/>
    <rect x="${fx+cell}" y="${fy+cell}" width="${5*cell}" height="${5*cell}" fill="#fff"/>
    <rect x="${fx+2*cell}" y="${fy+2*cell}" width="${3*cell}" height="${3*cell}" fill="#0B1220"/>`;
  return `<svg width="176" height="176" viewBox="0 0 ${size*cell} ${size*cell}" style="border-radius:12px; background:#fff;">
    ${cells}
    ${finder(0,0)}
    ${finder((size-7)*cell,0)}
    ${finder(0,(size-7)*cell)}
  </svg>`;
}

      </div>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#closeModal').onclick = ()=>{ state.modal=null; renderModal(); };

  const copyBtn = overlay.querySelector('#copyCode');
  if(copyBtn) copyBtn.onclick = ()=>{
    navigator.clipboard.writeText(copyBtn.dataset.value).catch(()=>{});
    const t = overlay.querySelector('#copiedMsg'); if(t) t.classList.add('show');
    toast('Código copiado.');
  };
  const confirmBtn = overlay.querySelector('#confirmPay');
  if(confirmBtn) confirmBtn.onclick = ()=>{
    confirmBtn.disabled = true; confirmBtn.innerText = 'Confirmando...';
    setTimeout(()=>{
      bill.status = 'pago'; bill.method = tab; bill.paidAt = todayISO(); bill.valorPago = calc.valor;

      renderClient();
      toast(`Pagamento via ${tab==='pix'?'Pix':'boleto'} confirmado (simulação) — ${fmtBRL(calc.valor)}.`);
    }, 900);
  };
  const printBtn = overlay.querySelector('#printBoleto');
  if(printBtn) printBtn.onclick = () => openBoletoPrintView(bill, calc);
}

      ${sec==='contas' ? adminContasHTML() : ''}
    </main>
  </div>`;

  document.getElementById('btnLogout').onclick = logout;

  if(sec==='clientes'){
    const openBtn = document.getElementById('openNovoCliente');
    if(openBtn) openBtn.onclick = ()=>{ state.adminModal='novo-cliente'; renderAdminModal(); };

    $app.querySelectorAll('[data-share-client]').forEach(b=>b.onclick=()=>{
      state.shareModal = {type:'cliente', id:b.dataset.shareClient};
      renderShareModal();
    });

  if(sec==='contas'){

      state.shareModal = {type:'conta', id:b.dataset.shareBill};
      renderShareModal();
    });
  }
  if(state.adminModal) renderAdminModal();
  if(state.shareModal) renderShareModal();
}

        const months = Math.min(12, Math.max(1, parseInt(fd.get('planMonths'),10) || 1));
        if(amount > 0 && firstDue){
          for(let i=0; i<months; i++){
            const dueDate = i===0 ? firstDue : addMonthsToDate(firstDue, i);
            const refDate = new Date(dueDate + 'T00:00:00');
            const label = `${desc} — ${MONTH_NAMES[refDate.getMonth()]}/${refDate.getFullYear()}`;
            state.bills.push({id:uid('b'), clientId:newClient.id, description:label, amount, dueDate, status:'aberto', method:null});
            mensalidadesGeradas++;
          }
        }
      }

      state.adminModal=null; renderAdmin();
      toast(mensalidadesGeradas > 0
        ? `Cliente cadastrado e ${mensalidadesGeradas} mensalidade(s) gerada(s).`
        : 'Cliente cadastrado.');
    };
  }
  const f2 = overlay.querySelector('#novaContaForm');
  if(f2) f2.onsubmit = e=>{
    e.preventDefault();
    const fd = new FormData(f2);
    state.bills.push({id:uid('b'), clientId:fd.get('clientId'), description:fd.get('description').trim(),
      amount:parseFloat(fd.get('amount')), dueDate:fd.get('dueDate'), status:'aberto', method:null});
    state.adminModal=null; renderAdmin(); toast('Conta gerada para o cliente.');
  };

  const f3 = overlay.querySelector('#indicacaoForm');
  if(f3) f3.onsubmit = e=>{
    e.preventDefault();
    const fd = new FormData(f3);
    const indicouId = fd.get('indicouId');
    const indicadoId = fd.get('indicadoId');
    const valorIndicou = parseFloat(fd.get('valorIndicou'));
    const valorIndicado = parseFloat(fd.get('valorIndicado'));

    if(indicouId === indicadoId){
      toast('Selecione dois clientes diferentes.'); return;
    }
    const cIndicou = state.clients.find(c=>c.id===indicouId);
    const cIndicado = state.clients.find(c=>c.id===indicadoId);
    if(!cIndicou || !cIndicado || !(valorIndicou > 0) || !(valorIndicado > 0)){
      toast('Preencha os dois clientes e os dois valores de desconto.'); return;
    }

    const findEarliestOpenBill = (clientId) => state.bills
      .filter(b => b.clientId === clientId && billStatus(b) !== 'pago')
      .sort((a,b) => a.dueDate.localeCompare(b.dueDate))[0];

    const billIndicou = findEarliestOpenBill(cIndicou.id);
    const billIndicado = findEarliestOpenBill(cIndicado.id);

    if(!billIndicou && !billIndicado){
      toast(`Nem ${cIndicou.name} nem ${cIndicado.name} têm contas em aberto no momento.`);
      return;
    }
    if(billIndicou) billIndicou.referral = { role:'indicou', withName: cIndicado.name, valor: valorIndicou };
    if(billIndicado) billIndicado.referral = { role:'indicado', withName: cIndicou.name, valor: valorIndicado };

    state.adminModal = null;
    renderAdmin();
    if(billIndicou && billIndicado){
      toast(`Descontos aplicados: ${fmtBRL(valorIndicou)} para ${cIndicou.name} e ${fmtBRL(valorIndicado)} para ${cIndicado.name}.`);
    } else if(billIndicou){
      toast(`Desconto de ${fmtBRL(valorIndicou)} aplicado só para ${cIndicou.name} — ${cIndicado.name} não tem conta em aberto.`);
    } else {
      toast(`Desconto de ${fmtBRL(valorIndicado)} aplicado só para ${cIndicado.name} — ${cIndicou.name} não tem conta em aberto.`);
    }
  };
}

/* ---------- Compartilhar link de acesso (WhatsApp / E-mail) ---------- */
function renderShareModal(){
  const old = document.getElementById('shareModalOverlay');
  if(old) old.remove();
  if(!state.shareModal) return;

  const { type, id } = state.shareModal;
  let client, bill, link, waMsg, emailSubject, emailBody, title, sub;

  if(type === 'cliente'){
    client = state.clients.find(c=>c.id===id);
    if(!client) { state.shareModal=null; return; }
    link = buildClientLink(client);
    title = 'Link de acesso do cliente';
    sub = client.name;
    waMsg = `Olá, ${client.name}! Aqui está o link para acessar a plataforma Konexia Link e acompanhar suas contas: ${link}`;
    emailSubject = 'Seu acesso à plataforma Konexia Link';
    emailBody = `Olá, ${client.name}!\n\nVocê já pode acompanhar suas faturas e pagar via Pix ou boleto pelo link abaixo:\n${link}\n\nQualquer dúvida, estamos à disposição.\n\nEquipe Konexia Link`;
  } else {
    bill = state.bills.find(b=>b.id===id);
    if(!bill){ state.shareModal=null; return; }
    client = state.clients.find(c=>c.id===bill.clientId);
    if(!client){ state.shareModal=null; return; }
    link = buildBillLink(client, bill);
    title = 'Enviar cobrança';
    sub = `${bill.description} · ${fmtBRL(bill.amount)}`;
    waMsg = `Olá, ${client.name}! Sua fatura "${bill.description}" no valor de ${fmtBRL(bill.amount)}, com vencimento em ${fmtDate(bill.dueDate)}, já está disponível para pagamento via Pix ou boleto: ${link}`;
    emailSubject = `Fatura disponível — ${bill.description}`;
    emailBody = `Olá, ${client.name}!\n\nSua fatura está disponível para pagamento:\n\nDescrição: ${bill.description}\nValor: ${fmtBRL(bill.amount)}\nVencimento: ${fmtDate(bill.dueDate)}\n\nAcesse o link abaixo para pagar via Pix ou boleto:\n${link}\n\nEquipe Konexia Link`;
  }

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'shareModalOverlay';
  overlay.innerHTML = `
  <div class="modal">
    <div class="modal-head">
      <div><h3>${title}</h3><div class="sub">${sub}</div></div>
      <button class="modal-close" id="closeShareModal">${ICONS.x}</button>
    </div>
    <div class="modal-body">
      <label style="font-size:13px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:6px;">Link da plataforma</label>
      <div class="copy-box">
        <div class="txt mono">${link}</div>
        <button class="copy-btn" id="copyShareLink" data-value="${link}">${ICONS.copy} Copiar</button>
      </div>
      <div class="toast-copied" id="shareCopiedMsg">Link copiado para a área de transferência.</div>

      <div style="display:flex; flex-direction:column; gap:10px; margin-top:20px;">
        <a class="btn btn-block" style="background:#25D366; color:#fff;" href="${buildWhatsAppLink(client.phone, waMsg)}" target="_blank" rel="noopener">
          Enviar por WhatsApp
        </a>
        <a class="btn btn-ghost btn-block" href="${buildEmailLink(client.email, emailSubject, emailBody)}">
          Enviar por e-mail
        </a>
      </div>
      <div class="hint" style="margin-top:14px;">
        Este é um link de demonstração (não autentica de verdade em outra aba). Em produção, ele levaria o cliente direto ao login com um token seguro.
      </div>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#closeShareModal').onclick = ()=>{ state.shareModal=null; renderShareModal(); };
  overlay.onclick = (e)=>{ if(e.target===overlay){ state.shareModal=null; renderShareModal(); } };
  overlay.querySelector('#copyShareLink').onclick = ()=>{
    navigator.clipboard.writeText(link).catch(()=>{});
    overlay.querySelector('#shareCopiedMsg').classList.add('show');
    toast('Link copiado.');
  };
}

/* ---------- Start ---------- */
(function bootFromLink(){
  const params = new URLSearchParams(window.location.search);
  const clienteId = params.get('cliente');
  const contaId = params.get('conta');
  if(clienteId){
    const c = state.clients.find(c=>c.id===clienteId);
    if(c){
      state.currentUser = {role:'cliente', ...c};
      if(contaId && state.bills.some(b=>b.id===contaId && b.clientId===c.id)){
        state.modal = {billId: contaId, tab:'pix'};
      }
    }
  }
})();
renderRoot();
</script>
